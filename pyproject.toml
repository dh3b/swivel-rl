[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swivel-rl"
version = "0.1.0"
description = "Experimental external mouse-to-camera input helper for Rocket League"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
swivel-rl = "swivel_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
